<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quien Quiere Ser Millonario</title>
    <link rel="stylesheet" href="../CSS/estilos.css">

    <!-- Tipografía similar -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<div id="miModal" class="modal">
    <div class="modal-contenido">
        <h2 id="modal-titulo"></h2>
        <p id="modal-mensaje"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>
</div>

<body>

    <div class="contenedor">

        <button id="startGame">EMPEZAR JUEGO</button>
        <button id="finalizar" style="display:none;">FINALIZAR</button>

        <!-- BARRA SUPERIOR -->
        <header class="barra-superior">
            <div id="premio" class="premio-texto"></div>
            <div id="acumulado" class="premio-texto">Premio acumulado: 0 dólares</div>
        </header>

        <!-- AYUDAS IZQUIERDA -->
        <div class="ayudas">
            <div class="ayuda-circulo">
                <img src="../CSS/img/5050.png" alt="50 50" class="icono-ayuda">
            </div>

            <div class="ayuda-circulo">
                <img src="../CSS/img/publico.png" alt="Publico" class="icono-ayuda">
            </div>

            <div class="ayuda-circulo">
                <img src="../CSS/img/cerrar-sesion.png" alt="Salir" class="icono-ayuda">
            </div>
        </div>


        <!-- LOGO CENTRAL -->
        <div class="logo-central">
            <img src="../CSS/img/quienquieresermillonatio.png" alt="logo" class="logo">
        </div>

        <!-- PREGUNTA -->
        <div id="pregunta" class="pregunta"></div>

        <!-- OPCIONES -->
        <div id="opciones" class="opciones"></div>

    </div>

    <script src="../JS/archivoJS.js"></script>
</body>

</html>
